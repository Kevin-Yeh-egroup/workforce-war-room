<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>匿名人才概況｜戰情室</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>匿名人才概況</h1>
        <div class="subtitle" id="sourceStatus">讀取公開安全資料中</div>
      </div>
      <nav class="toolbar" aria-label="頁面導覽">
        <a class="tool" href="/">回戰情室</a>
        <a class="tool" href="/radar-addon/index.html">週雷達</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div class="privacy">公開版只呈現匿名別名、狀態與工作層級；不含姓名、電話、Email、居住地、備註、工時或薪資資料。</div>
    <section class="metrics" id="metrics"></section>
    <section class="panel">
      <h2>篩選</h2>
      <div class="panel-body filters">
        <input id="q" placeholder="搜尋匿名別名或公開識別碼" />
        <select id="status">
          <option value="">全部狀態</option>
          <option value="active">active</option>
          <option value="paused">paused</option>
        </select>
        <select id="level"><option value="">全部工作層級</option></select>
      </div>
    </section>
    <section class="grid" id="peopleGrid"></section>
  </main>
  <script src="./talent.js"></script>
</body>
</html>
